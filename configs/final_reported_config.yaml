# JOCO clean final configuration for the remaining base reruns
# Locked at Step 0 before new COCO/VG/OI experiments are executed.

base_geometry_experiments:
  detector:
    model: yolov8n.pt
    topk_labels: 3
    detector_threshold: 0.25
    duplicate_iou: 0.60

  relation_generator:
    type: geometry
    tau_rel: 0.70
    score_definition: "geometry candidate score from spatial_relations()"
    learned_component_active: false

  optimization:
    relation_budget: "2n"
    alpha_detector: 0.40
    beta_ontology: 0.30
    gamma_relation: 0.20
    lambda_conflict: 0.0
    conflict_handling: "hard constraints; no additional soft conflict penalty"
    solver: CBC
    time_limit_s: 10
    relative_gap_tolerance: 1.0e-4
    domain_range: "transitive rdfs:subClassOf closure"
    fallback: "connected-component decomposition + deterministic feasibility repair"

  ontology_score:
    detector_confidence_in_s_onto: false
    implementation: "lexical + hierarchy/type proxy + relation/context support"
    lexical_weight: 0.5555555556
    hierarchy_weight: 0.3333333333
    context_weight: 0.1111111111
    embedding_semantic_component_active: false
    ontology_prior_component_active: false

  evaluation:
    iou: 0.50

statistics:
  seed: 42
  bootstrap_samples: 5000
  paired_permutations: 20000

reltr_v3_frozen_experiment:
  status: "completed; do not rerun as part of Step 0"
  query_threshold: 0.15
  joint_triplet_score_threshold: 0.05
  topk_triplets: 50
  entity_merge_iou: 0.70
  evaluation_iou: 0.50
  relation_budget: "2n"
  alpha: 0.40
  beta: 0.30
  gamma: 0.20
  seed: 42
  solver_time_limit_s: 10
